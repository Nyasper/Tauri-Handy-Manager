name: build-desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-24.04
            bundles: appimage,deb,rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Build Tauri bundles
        env:
          NO_STRIP: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Copy portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/handy-manager.exe" "src-tauri/target/release/handy-manager-portable.exe" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handy-manager-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/handy-manager-portable.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: handy-manager-*

      - name: Delete existing release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "handy-manager ${{ github.ref_name }}" \
            --notes "Binarios generados automáticamente: instalador NSIS, .exe portable, AppImage, .deb y .rpm." \
            $(find dist -type f)
